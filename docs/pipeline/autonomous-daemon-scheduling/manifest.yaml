# ============================================================================
# What this feature is  (the research doc is the contract — ZERO scope drift)
# ============================================================================
# A RUNTIME-AUTONOMY change to the Rust daemon (crates/daemon/). The schedules,
# skills, sources, job queue, resource arbiter and live-loop scrapers ALREADY
# EXIST and run today via the `--ingest <source>` CLI. This feature makes them
# fire and drain AUTONOMOUSLY while the daemon sits open — no quit-and-reopen,
# no manual button clicks. Three stacked gaps in the cron→execution path are
# closed (research §2.2), plus ProContract resumption is hardened so an
# awaiting-access item can never age out of the enrich scan window (§2.4/§4.4),
# plus the post-ingestion commercial stages gain an autonomous trigger (§2.5/§4.5).
#
# Six goals (research §3) — ALL ship, phases are execution ORDER not importance:
#   G1. Daemon fires due schedules autonomously while running (recurring tick),
#       incl. catch-up after sleep/wake.
#   G2. Cron-enqueued kinds (sync_source, source_health, auth_refresh,
#       validation_*) execute end-to-end via an always-on worker.
#   G3. CLI manual paths (--ingest, --run-next-job) keep working unchanged; the
#       desktop ingestion button becomes functional for free.
#   G4. ProContract awaiting-access items tracked in daemon state + swept by
#       enrich regardless of the portal's "Recently added" ordering.
#   G5. Concurrency-correct under WAL single-writer (serve + lease heartbeat +
#       new scheduler tick + new worker lanes).
#   G6. Commercial pipeline (landed-cost→net-gate→manifest) advances after
#       autonomous ingestion without an operator pressing "Re-run pipeline".
#
# This is NOT a change to WHAT the skills scrape (N1/N2), NOT multi-daemon (N3),
# NOT a new remote/HTTP trigger (N4).

