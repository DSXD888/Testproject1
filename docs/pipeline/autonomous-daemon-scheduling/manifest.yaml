# ============================================================================
# Operator/design decisions ALREADY RESOLVED in the research doc (research §4, §8).
# Step 01 TRANSCRIBES these verbatim into the spec — it does NOT re-decide them.
# ============================================================================
recorded_decisions:
  fold_startup_into_tick: "Q2 RESOLVED — tick subsumes enqueue_startup_cron_jobs; run the tick body once at thread start (cold-start catch-up) then on interval. Bootstrap-vs-first-tick race is dedup-closed by the identical idempotency key cron:{source}:{skill}:{scheduled_for} + find_existing_enqueue_ack read-before-write. Delete the separate startup path once the tick lands. (research §4.1)"
  two_lane_worker: "Q3 RESOLVED — TWO lanes by job class, NOT single-serial and NOT a homogeneous pool: (a) PTY/browser lane (sync_source, source_health, auth_refresh; sized to browser_slots=2); (b) coverage/deterministic lane (commercial_sweep + validation_*). Each lane its own claim loop filtering claim_next_job by kind-class. Falsifiable via the head-of-line test (worker_004); fall back to a kind-aware pool ONLY if that test cannot pass. (research §4.2)"
  commercial_trigger_model: "Q8 RESOLVED (principal) — commercial stages fire via a NEW scheduled `commercial_sweep` cron kind (~07:00 UTC slot) with a COVERAGE-DRIVEN body, executed IN-PROCESS by the worker's coverage/deterministic lane. It runs the EXISTING landed-cost → run_net_margin_gate_once → manifest-generation passes over eligible rows. It MUST NOT call trigger_pipeline_rerun (that is a desktop PID-stop/relaunch affordance and stays manual-only). (research §4.5)"
  clock_seam_is_design_req: "The clock-injection seam is a DESIGN REQUIREMENT, not just a test hook. The tick body is `fn run_scheduler_tick(scheduler, registry, db, now: DateTime<Utc>)`; production supplies Utc::now(), tests supply a fixed ts(). It is exposed as a one-shot autonomous entrypoint `--run-scheduler-once --tick-now <rfc3339>` (evaluate schedules at the injected instant → enqueue → drain worker to quiescence → exit 0). Without it the §7 E2E autonomy tests are unwritable. IN SCOPE, not optional. (research §4.1, §7c)"
  schedule_values_unchanged: "Existing source schedule values (FTS 04:15 etc.) stay code-defined in sources/registry.rs + scheduler/cron.rs. Out of scope to retune. The feature adds exactly ONE new slot: the ~07:00 commercial_sweep. (research §9)"

# ============================================================================
# OPEN QUESTIONS the SPEC must resolve (research §8). These are NOT scope cuts —
# they are genuine design/operator decisions the research doc deliberately left
# to the spec. Step 01 escalates each to the operator and TRANSCRIBES the
# decision; it never silently drops the underlying feature. (Mirrors goods-led's
# recorded_decisions / open_defaults_recommended escalation pattern.)
# ============================================================================
open_questions_for_spec:
  Q1_worker_exec_context: "Own StateDb connection per worker/lane vs a shared services handle. HIGHEST-RISK unresolved decision (research §11) — shapes the §4.3 refactor surface and §6 R8 WAL-contention behavior. Lease-heartbeat precedent favors own-connection-per-lane. SPEC'S FIRST DECISION."
  Q4_awaiting_access_modeling: "Dedicated `procontract_pending_enrichment` TABLE (lean; keeps interest_registration.state='completed', avoids the re-registration landmine; ships as migrations/0015_*.sql, schema_epoch 10→11 across all constants) VS an extra state-string value in an existing process_stage_status column (NO epoch bump but MUST widen the re-registration guard — §4.4 landmine). Pick one; both have a §7e test."
  Q5_staleness_policy: "Expiry policy for awaiting-access: notice-level deadline_at (may be null) and/or max_age fallback; operator-visible? HARD CONSTRAINT: must NOT key off the RFx response deadline (unknown for these items)."
  Q6_shadow_flag: "Should source_health / auth_refresh autonomous execution be gated behind a flag initially (shadow) before full enforcement, mirroring the validator rollout philosophy? (Default recommendation: ship behind a shadow flag.)"
  Q7_desktop_ux: "Surface scheduler running / last tick / next run / awaiting-access count in the desktop control panel? Read-only CronStatusSnapshot already exists to extend (build_cron_status_snapshot, daemon main.rs:3890). If taken, this spans THREE surfaces, NOT 'TS only': (1) daemon-Rust — add scheduler/awaiting-access fields to the snapshot; (2) desktop-Rust — pass them through daemon_bridge/query_service; (3) desktop-TS/React — render. So its gate includes cargo checks for crates/daemon + apps/desktop/src-tauri AND bun build/test/lint. NAMED + bounded — not dropped."
  Q8_residual_chained_nudge: "Whether to ALSO enqueue a deduped commercial_sweep immediately after a successful ingestion run (a chained nudge so a new process doesn't wait until 07:00). Optional optimization; the scheduled+coverage model is correct without it. Defer unless the spec can keep the source-scraper boundary clean."
  Q9_registry_reload_trigger: "Tick registry-reload trigger: wire a monotonic registry GENERATION COUNTER (AtomicU64) bumped by every IPC source-mutation handler (lean) VS poll MAX(sources.updated_at) each tick. Either avoids per-tick reloads. Pick one; ensure newly-enabled sources re-seed last_run_at so they don't fire a spurious catch-up burst."

# ============================================================================
# Scope contract — every feature surface below MUST survive to beads (ZERO drift).
# Source: research §3 (goals), §4 (architecture), §5 (routing), §9 (scope summary).
# Phases are EXECUTION ORDER, not importance tiers. Nothing silently dropped.
# ============================================================================
feature_surface:
  scheduler_tick:                          # §4.1 [G1]
    - "Background scheduler-tick thread modeled on SyncLeaseHeartbeat::spawn (own StateDb connection; recv_timeout(tick_interval) loop, default ~30-60s, configurable)"
    - "Build CronScheduler + seed last_run_at from history ONCE at thread start — do NOT rebuild/re-seed every tick"
    - "Per tick: read injected `now` → dispatch_due_jobs(&registry, now) → enqueue due jobs (dedup via find_existing_enqueue_ack) → record_enqueued in-memory so next_run_at advances"
    - "Clock-injection seam: run_scheduler_tick(scheduler, registry, db, now: DateTime<Utc>) — NO inline Utc::now() in the tick body (design requirement)"
    - "One-shot autonomous entrypoint `--run-scheduler-once --tick-now <rfc3339>`: evaluate at injected instant → enqueue → drain worker to quiescence → exit 0 (drives the §7c M1/M2 manifests)"
    - "Registry-reload trigger (Q9): reload SourceRegistry::load + rebuild in-memory schedules ONLY when changed; newly-enabled sources re-seed last_run_at (no spurious catch-up burst)"
    - "Fold startup-enqueue into the tick path (Q2 resolved): run tick body once at thread start, then on interval; delete enqueue_startup_cron_jobs once the tick lands"
    - "Sleep/wake catch-up via existing schedule.after(last_run_at) math; long monotonic gap on wake → overdue slot enqueued next tick"
    - "Tick runs on a SEPARATE thread from the worker — a long PTY run must never block the tick (R2)"
  worker_pump:                             # §4.2 [G2]
    - "Continuous worker: claim next ready job (claim_next_job, COALESCE(scheduled_for, created_at) overdue-first) → route by kind → execute → complete/fail → continue"
    - "TWO lanes by job class (Q3 resolved): PTY/browser lane (sync_source, source_health, auth_refresh; sized to browser_slots=2) + coverage/deterministic lane (commercial_sweep, validation_*). Each lane its own claim loop filtering by kind-class"
    - "Idle backoff: when claim_next_job returns None, poll with short idle backoff — NO busy-spin"
    - "Respect ResourceArbiter exactly as the manual path does (browser_slots=2, agent_slots=4, procurement_source_lanes=1, supplier_source_lanes=2) — never exceed quotas (R4)"
    - "Defer-on-denial with backoff: a claimed job denied admission (ArbiterDecision::Denied) returns to status='pending' with NO attempt_count bump and NO held lease; denial backoff (next_eligible_at or in-memory per-lane cool-down, jittered) prevents hot-looping. MUST NOT reuse the failure/retry attempt_count machinery (a denial is not an attempt). Prefer in-memory cool-down to avoid an epoch bump (Q4-adjacent)"
    - "Worker writes local state directly (local SQLite = operational authority); the L4 writer lease gates only remote push, NOT local execution — worker runs regardless of lease state"
  live_loop_refactor:                      # §4.3 [G2/G3]
    - "Extract per-source execution body into a function accepting (claimed job, runtime/services handle, cli/config) that does NOT assume it created the job"
    - "Keep thin --ingest CLI wrappers that enqueue+claim then call the shared body (preserves --ingest path, G3)"
    - "Map sync_source job → source body, keyed on (source_id, skill_id) NOT source_id alone (discover/interest/enrich share source_id=procontract, distinct skill_id)"
    - "Per-source execution-time parameter derivation (payload carries schedule metadata, NOT run params): fts (download_root, page/window defaults); contracts-finder (as fts); procontract-discover (download_root, discover window); procontract-register-interest (candidate set from load_procontract_interest_candidates, NOT a payload list); procontract-enrich (cursor from source_cursors, download_root, AND the G4 awaiting-access work-list)"
    - "Commercial stages are NOT in this sync_source mapping — they are stage_run_id passes handled by commercial_sweep (§4.5)"
  new_job_kind_handlers:                   # §5 [G2]
    - "source_health handler — NEW: invoke the source-health/* canary skill (skill exists, no daemon job-handler today)"
    - "auth_refresh handler — NEW: invoke the auth-signin/* skill (skill exists, no daemon job-handler today)"
    - "validation_cross_model_audit handler — NEW: no executor exists today (kind appears only in cron.rs); distinct from the existing semantic_validate per-result sub-job"
    - "validation_calibration_readiness_sweep handler — NEW: no executor exists today"
    - "Extend run_next_workflow_job's 3-kind match (main.rs:1703, other => fail_job at :1722) and the worker routing to cover ALL cron kinds"
  commercial_sweep:                        # §4.5 [G6]
    - "New cron kind `commercial_sweep` + ONE new ~07:00 UTC schedule slot after the ingestion window"
    - "Coverage-driven body: run existing landed-cost → run_net_margin_gate_once → manifest-generation over ELIGIBLE rows (advance every process/candidate lacking a current downstream decision)"
    - "Stage-shape nuance: net-gate is a PURE DB sweep (run_net_margin_gate_once, no skill); landed-cost + manifest MAY invoke their skill runners for eligible rows → they consume agent/skill slots, so the coverage/deterministic lane takes NO procurement-source browser slot but the ResourceArbiter is STILL in force for the skill-backed sub-passes (research §4.2/§4.5). Do not treat the coverage lane as arbiter-free."
    - "Reconcile (not reuse) trigger_pipeline_rerun: it stays a manual desktop affordance that kills the daemon by PID. A manual rerun firing mid-autonomous-sweep SIGTERMs the daemon mid-run — safe because per-process-scoped sweep txns (R8) commit incrementally and the next 07:00 sweep is coverage-idempotent/self-healing. The two paths must coexist without corrupting each other (research §9 'reconcile not reuse')"
    - "Execute IN-PROCESS on the coverage/deterministic lane under the arbiter — MUST NOT call trigger_pipeline_rerun (desktop PID-stop affordance stays manual-only)"
    - "Two-layer dedup: per-slot cron idempotency key cron:commercial-sweep:{skill}:{scheduled_for} + coverage-idempotent body (only advances un-decided processes)"
    - "Q8 residual: optional chained nudge (enqueue deduped commercial_sweep after successful ingestion) — defer unless spec keeps the boundary clean"
  procontract_resumption:                  # §4.4 [G4]
    - "Awaiting-access modeling (Q4): dedicated procontract_pending_enrichment table (0015_*, epoch 10→11) OR state-string + widened re-registration guard"
    - "Create row when register-interest SUCCEEDS (interest in, access pending); landmine: do NOT touch interest_registration.state (stays 'completed' so the re-fire guard still excludes it)"
    - "Lifecycle (each transition's trigger + exact row): create / keep (bump observation_count) / clear (state='enriched' on live tender event + docs) / backfill (untracked not_yet_responded item) / expire (now>deadline_at OR now-interest_registered_at>max_age)"
    - "observation_count is the enrich-SWEEP counter — deliberately SEPARATE from the job-retry attempt_count"
    - "Enrich sweeps the daemon-tracked awaiting-access set (NOT just 'Recently added'), locating each item on the portal by stored advertId/source_notice_id — independent of Recently-added ordering and maxPages"
    - "Skill contract change (procontract-enrich-tender): optional `awaitingAccessTargets: [{advertId, sourceNoticeId, processId}]` input; merge = normal Recently-added scan UNIONed with direct-by-advertId navigation for un-located targets, deduped by advertId; empty work-list ⇒ behaves exactly as today (backward compatible)"
    - "Staleness expiry (Q5): notice-level deadline_at (captured at discover, may be null) OR max-age-since-interest fallback; MUST NOT key off the RFx response deadline (unknown for awaiting-access items)"
  concurrency_correctness:                 # §6 [G5]
    - "Worker exec context (Q1): own StateDb connection per lane (lease-heartbeat precedent) vs shared services handle — spec's first decision"
    - "WAL single-writer correctness with up to 4 writers (serve/IPC, lease heartbeat, scheduler tick, worker lanes): short write transactions + busy_timeout=5000; commercial sweep transactions per-process-scoped (yield the writer lock between processes), not one giant transaction (R8)"
    - "R7: procurement_source_lanes=1 serializes same-source runs — a second concurrent sync_source for the same source is denied at admission (SourceLaneExhausted) and defers, never runs concurrently"
    - "Escalation path if contention surfaces: single-writer actor (R1)"
    - "Sleep/wake interaction: in-flight PTY tainting on host sleep (pty/health.rs detect_host_sleep, 5s threshold) vs worker claim/lease (300s lease, 60s heartbeat) (R5)"
  desktop_status_surfacing:                # §9, Q7 — operator-decided scope
    - "OPTIONAL (Q7): surface scheduler running / last tick / next run / awaiting-access count in the desktop control panel (extend the existing read-only CronStatusSnapshot). Spec scopes per operator decision — NAMED + bounded, never silently dropped"
  tests:                                   # §7 — real E2E, no mocks
    - "NEW scheduler_tick.rs (tick_001..005), worker_pump.rs (worker_001..005), procontract_resumption.rs (M3, net-new suite — NO ProContract integration test exists today)"
    - "E2E manifests M1 (end-to-end autonomy G1+G2), M2 (commercial autonomy G6), M3 (ProContract lifecycle G4), M4 (manual-path regression + live buttons G3), M5 (concurrency soak G5)"
    - "Existing-test impacts (§7a): cron_scheduler.rs (add 07:00 slot to test 001 anchors + test 006 catch-up order), job_claim.rs (new kinds claimable — add tests, don't mutate ordering tests), agent_procurement_ingestion.rs / agent_contracts_finder_ingestion.rs (refactor regression guard — must still pass unchanged), sqlite_schema.rs (only if Q4 picks a table)"
    - "Schema-migration test (§7e, conditional on Q4): if table → PRAGMA user_version==11 + schema_migrations '0015_*' + table/columns; if state-string → widened re-fire guard test"

