# === Cross-domain notes the validate-spec step must surface ===
spec_callouts:
  product_commodity_codes_locality:
    spec_says: "via `product_commodity_codes` junction, existed since L0"
    actual_repo_state: "product_commodity_codes is NOT in any SQLite migration (0001..0012). It exists ONLY in infra/supabase/migrations/0001_projection_tables.sql and 0004_rls_policies.sql."
    resolution: "Spec must clarify ONE of: (A) L5 creates the SQLite junction in a new migration NNNN (next-free, 0013_l5_product_commodity_codes.sql); (B) L5 stores commodity-code candidates as a JSONB column on product_candidates (existing) and the projection layer denormalizes to the Supabase junction. Recommended: (A) — keeps local SQLite consistent with the projection model."
  marketplace_skill_authorship:
    spec_says: "§1.15 New Skills (Layer 5) — Amazon/Alibaba/1688 listed as new"
    actual_repo_state: "alibaba/, amazon/, 1688/ all exist with SKILL.md + checkpoint.schema.json + result.schema.json at promotion_stage=candidate (eBay is the most mature; Alibaba SKILL.md is 241 lines)."
    resolution: "Replace 'New Skills' framing with 'Skills to mature from candidate to stable for L5'. Capture the actual delta: Chinese retry on Alibaba, Chinese-only short clusters on 1688, alias families on Amazon, source-health canary expansion, validator overlay binding. PCS truly is new (gated by Scotland scope decision). DOES NOT REDUCE SCOPE — clarifies HOW."
  hmrc_fpo_endpoint_name:
    spec_says: "(note: \"FPO\" on HMRC's developer portal refers to Fast Parcel Operator — verify the correct API endpoint name during implementation)"
    actual_repo_state: "Layer doc and existing skills/landed-cost/hmrc-customs-classification/ both use 'FPO' loosely. There is no shipped HMRC client yet."
    resolution: "Step 01 validate-spec captures the open question; step 03 TDD records the planned endpoint(s) including the precise resource path; step 05 strategy makes the verification a prerequisite of the customs-recall bead."
  errorcode_enum_extension:
    spec_says: "§3.5 — 10 new customs error types"
    actual_repo_state: "ErrorCode enum lives in crates/daemon/src/errors/manifest.rs:20+ (NOT in validation/policy.rs — that file holds ValidationPolicyMode/Trigger enums for L3 validation logic). It is a Rust enum with ~44 variants. Adding 10 variants requires recompilation and updating the as_str() matcher (same file) plus any exhaustive matches across the daemon."
    resolution: "L5 is not 'pure plug-and-play' for the daemon — the customs error vocabulary is compile-time. Spec should acknowledge this. Skill plug-and-play applies to skill manifests, NOT to daemon enum vocabulary. The skill-plug-and-play rule still holds for the marketplace skills + PCS skill registration — those are plug-and-play to the EXTENT that registry.rs is updated to surface them. Document both clearly."
  cron_scheduler_extension:
    spec_says: "§1.11 — daily TRA watcher; HMRC tariff news watcher; FX monthly rollover; §1.4 source-health canary"
    actual_repo_state: "crates/daemon/src/scheduler/cron.rs already has VALIDATION_CALIBRATION_READINESS_SWEEP_CRON and VALIDATION_CROSS_MODEL_AUDIT_CRON entries; pattern is established."
    resolution: "L5 adds 4 CronJobDefinition entries with cron expressions following the existing pattern. Bootstrap doc must list the env vars or feature flags that enable each watcher in dev vs prod."
  cbam_forward_placeholder_dates:
    spec_says: "UK CBAM applies from 1 January 2027 with a trial sector rate in Q4 2026"
    actual_repo_state: "Today is 2026-05-08. Trial window starts within 5 months."
    resolution: "Step 03 TDD must include a future-regulatory-exposure-flag test scenario for tender delivery windows crossing 2027-01-01. Step 05 strategy treats CBAM placeholder population as Phase 6 (final hardening) — placeholder logic ships before any rate-bearing logic."
  pcs_scotland_scope:
    spec_says: "§3.6 Open Question — Scotland scope undecided"
    actual_repo_state: "skills/procurement-ingestion/pcs/ does NOT exist."
    resolution: "Step 01 validate-spec must SURFACE this as a hard precondition: a project-level decision must be made before step 07 (bead creation). If Scotland is in scope, PCS skill is created; if not, it's removed from L5 scope (with explicit Open Question note retained) — no scope drift."
  agents_md_duplicated_blocks:
    spec_says: "(silent on this)"
    actual_repo_state: "AGENTS.md has both an authoritative 'br' block (~lines 262-305) and a duplicated/outdated 'bd' block (~lines 666-723). L4 manifest also flagged this."
    resolution: "All L5 handoffs must use 'br' + 'bin/br-sync' (or 'br sync --flush-only' followed by manual git add .beads/ + commit). Cite the authoritative block."
  no_ci_workflows:
    spec_says: "(silent)"
    actual_repo_state: "There is no .github/workflows/ directory. Tests run locally only."
    resolution: "L5 bootstrap doc lists the local quality gate sequence (cargo fmt/check/clippy/test + bun run build/test/lint). Optional: L5 strategy may consider adding a minimum CI workflow as a final-phase bead, but only if the L5 owner authorizes — defaults to NOT in scope."

