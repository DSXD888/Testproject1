    lines: 181
    notes: "InteractionProfile enum at lines 104-108 (PtyRequired/ContractRequired/ContractPreferred). bid-portal-procontract declares interaction_profile: pty_interactive → resolves to PtyRequired → adapter selects PTY execution mode."
  daemon_pty_session:
