    blocks: "step 05 (strategy) phase ordering; step 07 (beads) Phase 1 file list"
    options:
      - "(A) Phase 1 creates `crates/daemon/src/bid_workflow/` module skeleton; Phase 2 dispatch wires to stub; Phase 3 fills bodies. (RECOMMENDED — resolves Phase 2/3 deadlock)"
      - "(B) Inline `run_bid_workflow_job(...)` in main.rs alongside existing extract_document_* handlers (no new module; flatter structure but adds to main.rs's 31K lines)"
      - "(C) Separate `crates/bidding-runner/` sibling crate (cleanest isolation but most complex; introduces a new workspace member)"
    recommended_default: A
    rationale: "Already documented in manifest spec_callouts.bid_workflow_runner_module_placement; operator should confirm or override."

  q2_model_profile:
    question: "Use `portal_form_high_reliability` (NEW profile per spec §1.7) or reuse existing `browse_stable_low_cost`?"
    tier: 1
    blocks: "Phase 1 daemon-code work; Phase 4 skill frontmatter"
    options:
      - "(A) Introduce `portal_form_high_reliability` as L6 deliverable. Phase 1 adds match arm in main.rs `model_profile.as_str()` block. Cost: ~1 line + new profile config."
      - "(B) Reuse `browse_stable_low_cost`. Update spec §1.7 to drop the new-profile claim. Cost: 0 daemon change; semantic clarity lost (the skill is more sensitive than ordinary browsing)."
      - "(C) Introduce profile as alias-of-existing initially (same routing as browse_stable_low_cost); record a distinct routing change as a separate approved follow-up. Cost: ~3 lines."
    recommended_default: A
    rationale: "Spec §1.7 is explicit; operator should confirm before TDD/strategy bakes in."

  q3_errorcode_set:
    question: "Final NEW ErrorCode variant set (TDD-determined; operator may have opinions)"
    tier: 1
    blocks: "step 03 TDD; Phase 1 daemon code"
    options:
      - "(A) 4 likely-new variants only: BID_SUBMISSION_FAILED, BID_DUPLICATE_DETECTED, BID_SIDE_EFFECT_CAP_EXCEEDED, BID_READINESS_GATE_FAILED (drop BID_PORTAL_CHANGED → reuse PAGE_SHAPE_DRIFT; drop BID_PORTAL_AUTH_EXPIRED → reuse AUTH_STATE_STALE in daemon-orchestrated retry pattern)"
      - "(B) 6 variants (all of A plus BID_PORTAL_CHANGED + BID_PORTAL_AUTH_EXPIRED for portal-specific context distinctness)"
      - "(C) TDD step 03 author decides based on careful audit of existing variants and L6 failure-mode taxonomy"
    recommended_default: A
    rationale: "Existing PAGE_SHAPE_DRIFT and AUTH_STATE_STALE error_context can carry portal-specific data; adding distinct variants adds complexity without clear benefit. But operator may want explicit portal-specific codes for operational dashboards."

  q4_default_review_required:
    question: "Default `BidScopePayload.reviewRequired` for desktop-initiated bids?"
    tier: 1
    blocks: "Phase 6 desktop UI default state; Phase 7 live demo policy"
    options:
      - "(A) true — operator MUST review every draft before submission. Safer. Matches live-demo policy (decision_5)."
      - "(B) false — skip review when validation is clear. Faster but riskier."
      - "(C) Per-opportunity operator choice in desktop UI; no global default."
    recommended_default: A
    rationale: "L6's whole point is operator-reviewable artifacts (not autonomous submissions). MVP should default to safer."

  q5_default_side_effect_cap:
    question: "Default `BidScopePayload.sideEffectCap` for desktop-initiated bids?"
    tier: 1
    blocks: "Phase 6 desktop UI; Phase 7 live-demo policy"
    options:
      - "(A) REMOTE_DRAFT — workflow can only reach `draft_saved`; operator explicitly raises cap to authorize FORMAL_SUBMISSION on review. Matches live-demo policy."
      - "(B) FORMAL_SUBMISSION — workflow can complete a real submission in one shot if validation passes."
      - "(C) Per-opportunity operator choice in desktop UI (no global default)."
    recommended_default: A
    rationale: "Constitutional invariant 'No real-money bids without human approval' favors safer default; operator can opt into FORMAL_SUBMISSION explicitly per bid."

  q6_bid_state_check_constraint:
    question: "Add SQL CHECK constraint on `bid_workflow_states.bid_state` column?"
    tier: 1
    blocks: "Phase 1 schema work (would require new migration)"
    options:
      - "(A) Add CHECK in new migration (e.g., 0014_l6_bid_state_check.sql) — clean SQL contract; small migration; matches L0 cross-domain note suggestion"
      - "(B) Rely on Rust enum enforcement only — no migration; matches current state; faster"
    recommended_default: B
    rationale: "Spec §1.9 says 'No new tables. No new columns.' — adding CHECK is technically a schema change. Rust enforcement is sufficient. Documented in spec_callouts.bid_state_check_constraint."

  # ----- Tier 2: IMPLEMENTATION DETAILS — TDD/strategy can decide; operator input valuable -----

  q7_document_acquisition_source:
    question: "Where do `BidDocument[]` file paths come from?"
    tier: 2
    blocks: "Phase 4 skill playbook step 8 (Upload required documents); Phase 6 desktop UI"
    options:
      - "(A) Operator uploads via desktop drag-drop (Phase 6 UX work)"
      - "(B) Pulled from L5 `tender_document_sets` (auto-resolution from selected lots)"
      - "(C) Hybrid: auto-pull + operator can override per-document"
    recommended_default: C
    rationale: "Most flexible. Operator can rely on auto-pull for routine docs and override for tender-specific certificates."

  q8_cron_entries:
    question: "Add cron entries for bid workflow health?"
    tier: 2
    blocks: "Phase 6 daemon scheduler work"
    options:
      - "(A) None — L6 is fully operator-triggered (matches spec)"
      - "(B) Add (i) draft_saved staleness check (warn if >N days old), (ii) Procontract auth proactive refresh"
      - "(C) Keep L6 operator-triggered and revisit as a separately approved enhancement after archive"
    recommended_default: A
    rationale: "L6 spec says 'no cron entries needed'. Adding them is outside the spec; operator can re-evaluate after archive based on observed staleness patterns."

  q9_validator_calibration_depth:
    question: "Validator-overlay calibration corpus scale for `tests/fixtures/calibration/bid-portal-procontract/`?"
    tier: 2
    blocks: "Phase 5 validator overlay tests; Phase 7 calibration runs"
    options:
      - "(A) Light: ≥3 inputs per variant (simple/medium/complex) — total ~9 inputs"
      - "(B) Match L5 customs scale: gold/silver/bronze/pairwise with 100+ cases per category (heavy effort but more robust)"
      - "(C) Start with light (option A); require a separate approved calibration-expansion task once operational learnings accumulate"
    recommended_default: C
    rationale: "L6 is a single-portal feature; comprehensive calibration is more impactful for multi-source pipelines like L5 customs. Light start + expand based on usage is pragmatic."

  q10_stage15_handoff_fate:
    question: "Stage-15 legacy bid-workflow handoff fate after L6 archive?"
    tier: 2
    blocks: "step 15 archive"
    options:
      - "(A) Delete entirely (cleanest; preserves history via git)"
      - "(B) Add 'SUPERSEDED by L6' header banner; leave for historical context"
      - "(C) Rewrite as L6 operational runbook (how to operate the bid workflow in production)"
    recommended_default: B
    rationale: "Historical context useful for understanding why L6 exists; rewrite is separate operational doc effort outside L6 scope."

  # ----- Tier 3: LIVE DEMO / OPERATIONAL — operator must arrange before step 12 -----

  q11_live_demo_opportunity_ref:
    question: "Which Procontract opportunity for the live demo?"
    tier: 3
    blocks: "Phase 7 live demo execution"
    operator_action_required: "Pre-step-12: operator selects a real Procontract opportunity ref that (a) is open for expressions of interest, (b) won't generate buyer-visible legal commitment when reaching draft_saved (first run, sideEffectCap=REMOTE_DRAFT), (c) operator is genuinely willing to bid on (for the second run that escalates to FORMAL_SUBMISSION)."
    deliverable: "Record opportunity ref in live-demo/first-run-REMOTE_DRAFT.md per step 15 6c"
    preflight_artifact: docs/pipeline/l6-request-pipeline-automation/live-demo/preflight-2026-05-23.md
    preflight_status: "BLOCKED 2026-05-23: CDP persistence and AgentMail are green; operator-selected opportunity ref, populated shared_company_profile/operator_decision_heads data, and reachable Supabase/PostgREST verification path are still required."

  q12_company_profile_population_timing:
    question: "When does `shared_company_profile` (Supabase remote-owned) get populated?"
    tier: 3
    blocks: "Phase 7 live demo (skill needs CompanyProfile injected)"
    options:
      - "(A) Pre-L6 — operator populates via Supabase admin tooling before pipeline starts"
      - "(B) Phase 6 — desktop UI gets a 'company profile editor' as part of bid-workflow tab"
      - "(C) Phase 7 prep — operator populates via SQL/admin before first live demo"
    recommended_default: C
    rationale: "Locked L6 scope: a one-time SQL insert of operator's company data before live demo. A UI editor requires a separate approved task."

  q13_certificate_expiry_warning:
    question: "Warning timeline before `certifications[].expiryDate` blocks readiness gate?"
    tier: 3
    blocks: "Phase 3 readiness-gate logic; Phase 6 desktop UI warnings"
    options:
      - "(A) No warning — block-on-expiry only (matches spec §1.3 verbatim)"
      - "(B) 30-day pre-expiry warning shown in desktop UI; soft block at expiry"
      - "(C) 60-day pre-expiry warning"
    recommended_default: A
    rationale: "Spec is silent on pre-warning. The locked L6 route keeps to spec; warning behavior requires a separate approved UX task."

  q14_cdp_session_contention:
    question: "How does daemon serialize CDP browser access across multiple Procontract skills?"
    tier: 3
    blocks: "Phase 7 live demo execution if multiple skills run simultaneously"
    options:
      - "(A) Daemon's existing resource arbiter handles browser-slot contention (verify by reading L3 resource arbiter code)"
      - "(B) Operator avoids parallel Procontract skill runs during live demo (operational discipline)"
      - "(C) Add explicit browser-mutex check to Phase 4 bid skill"
    recommended_default: A
    rationale: "L3 resource arbiter should already handle this. Phase 3 readiness-gate work should verify before live demo."

  q15_phase_count_finalize:
    question: "Strategy step 05 phase count (suggested 7)?"
    tier: 4
    blocks: "step 05 strategy ordering; EXECUTION-GUIDE find-replace if non-7"
    options:
      - "(A) 7 phases per recommendation (Foundation/Daemon Runtime/State Machine/Portal Skill/Validator+Bidding/UI/Live Demo)"
      - "(B) 6 phases: merge State Machine into Daemon Runtime"
      - "(C) 8 phases: split Portal Skill into Schema + Playbook"
    recommended_default: A
    rationale: "Strategy step 05 author decides; EXECUTION-GUIDE has reconciliation note for non-7."

