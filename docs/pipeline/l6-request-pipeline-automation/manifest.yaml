    notes: "pull_cursors table at lines 103-120 has rows for operator_decision_heads + shared_company_profile (the L4 remote-owned tables L6 depends on)."
  migration_l5_product_commodity_codes:
    path: migrations/0013_l5_product_commodity_codes.sql
    notes: "L5 added this junction table — L6 reads from it during bid scope rendering (selected candidate → commodity codes for compliance/declaration form fields)."

  # Daemon — extend, don't rewrite
  daemon_main:
    path: crates/daemon/src/main.rs
    lines: 31087
    notes: |
      Live-loop, IPC listener, job dispatch, per-kind handler functions.
      CRITICAL: the job-kind dispatch (`match job.kind { ... }`) lives HERE in main.rs, NOT in
      crates/daemon/src/jobs/runner.rs. The reference dispatch arms are at lines ~1513-1517:
        "extract_document_structure" => run_extract_document_structure_job(runtime, &runner, claimed).await
        "extract_document_semantics" => run_extract_document_semantics_job(runtime, &runner, claimed, cli).await
      The handler functions themselves are also in main.rs:
        run_extract_document_structure_job at line 1529
        run_extract_document_semantics_job at line 1836
      L6 adds: (a) a `"run_bid_workflow" => run_bid_workflow_job(...)` match arm in the dispatch around line 1513+,
      (b) the handler function `run_bid_workflow_job(...)` — either inline in main.rs OR extracted to a new
      `crates/daemon/src/bid_workflow/` module (Phase 3 decides), (c) a `--run-bid-workflow <bid-job-id>` CLI
      subcommand for ops/manual recovery.
      The L5 readiness gate raw checks (CLASSIFICATION_AMBIGUOUS/TARIFF_BRANCH_DIVERGENCE/SUPPLEMENTARY_UNIT_MISSING/decision_grade=broker_required/classification_fresh_until_expired)
      are already wired at lines 5256-5260, 5436, 5498, 5510-5527, 5537-5542, 5781-5787 — L6 only ADDS a
      `blocks_ready_to_bid` aggregator above those raw checks.
  daemon_validation_policy:
    path: crates/daemon/src/validation/policy.rs
    lines: 1187   # total file size, not a line number
    notes: "ValidationPolicyMode enum at lines 17-25 (Always/Sample/Trigger/Skip). L6 bid-portal-procontract skill declares validation_policy: always; the fail-closed exception for portal submission is enforced at the bid-workflow state-machine layer (NOT a new policy mode — same Always mode, but verdict gating bid_submitted transition)."
  daemon_validation_executor:
    path: crates/daemon/src/validation/executor.rs
    lines: 1269   # total file size
    notes: "Validator job dispatch + verdict persistence. L6 bid-run validation jobs use this path with no changes."
  daemon_validation_manifest_writer:
    path: crates/daemon/src/validation/manifest_writer.rs
    lines: 54     # total file size (small wrapper file)
    notes: "write_hybrid_run_manifest() at lines 23-54 — L6 bid runs produce hybrid manifests with portal-specific extensions in DaemonEvidenceAppendix.artifact_refs (screenshot paths per step) and oqg_anomaly_summary (side-effect class progression checks)."
  daemon_errors_manifest:
    path: crates/daemon/src/errors/manifest.rs
    lines: 413   # total file size — verified 2026-05-21
    notes: |
      ErrorCode enum precise boundaries (verified 2026-05-21):
        - Line 19: `#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]`
        - Line 20: `pub enum ErrorCode {`
        - Lines 21-63: variant declarations (~45 variants after L5's 10 customs additions)
        - Line 64: `}` (close of enum)
        - Lines 65-115: `impl ErrorCode { fn as_str(&self) -> &'static str { match self { ... } } }`
        - Line ~365: `pub fn parse_error_code(raw: &str) -> Result<ErrorCode>` (string → enum)
      L5 added: CLASSIFICATION_AMBIGUOUS, TARIFF_BRANCH_DIVERGENCE, MEASURE_INTERACTION_UNKNOWN, EXPORTER_UNRESOLVED,
      SUPPLEMENTARY_UNIT_MISSING, VALUATION_MODE_CONFLICT, FPO_UNAVAILABLE, TRADE_REMEDY_WATCH_STALE,
      FX_RATE_MISSING, FREIGHT_ESTIMATE_FAILED.
      Adding a NEW variant requires updating ALL THREE locations: enum body + as_str() arm + parse_error_code() arm
      (the round-trip test fails otherwise). Then propagate clippy-surfaced exhaustive matches across 5-15 sites.

      L6 ADDS 6 new variants (decided by step 03 TDD; strawman list):
        - BID_PORTAL_CHANGED          (page fingerprint drift on Procontract — distinct from generic PAGE_SHAPE_DRIFT)
        - BID_SUBMISSION_FAILED       (final submit step failed — distinct from AGENT_SKILL_FAILED)
        - BID_DUPLICATE_DETECTED      (verifyPortalState() detected existing submission)
        - BID_PORTAL_AUTH_EXPIRED     (session expired mid-workflow; distinct from AUTH_STATE_STALE for portal-specific recovery flow)
        - BID_SIDE_EFFECT_CAP_EXCEEDED (skill tried to escalate past BidScopePayload.sideEffectCap — safety guard)
        - BID_READINESS_GATE_FAILED   (one of the §1.3 prerequisite checks blocked the workflow at runtime)

      Each requires: enum variant + as_str() arm + clippy-surfaced exhaustive matches in
      validation/policy.rs, validation/executor.rs, errors/markdown.rs, tracing/structured.rs,
      ipc/handlers/*.
  daemon_jobs_runner:
    path: crates/daemon/src/jobs/runner.rs
    lines: 1656
    notes: |
      Shared job-runner infrastructure: ClaimedJob, EnqueueJobRequest, JobLeaseHeartbeat,
      PersistSuccessRequest, PersistValidationVerdictRequest, SkillTelemetryWindow,
      CANONICAL_SCOPE_KINDS, re-exports of VALIDATOR_JOB_KIND / ValidatorVerdict from validation_executor.
      **NOTE: this file does NOT contain the `match job.kind { ... }` dispatch — that lives in main.rs
      around line 1513+. runner.rs is the shared-type layer that main.rs's dispatch functions consume.**
      L6 may add: an `EnqueueJobRequest` builder for `run_bid_workflow` jobs that captures the
      BidScopePayload + readiness-gate-evaluated context, but the dispatch arm itself is in main.rs.
      Existing `parent_job_id` + `continuation_chain_id` columns (workflow_jobs migration line 504-505)
      support multi-step bid workflow if step-level retry is needed.
  daemon_sources_registry:
    path: crates/daemon/src/sources/registry.rs
    lines: 1338
    notes: "Registered source/skill metadata. L6 ADDS one entry for skills/bid-portal-procontract/ + one for skills/validation/overlay-bid-portal-procontract/. Procontract source entry already exists (via procurement-ingestion/procontract-* skills) — confirm by grep before duplicating."
