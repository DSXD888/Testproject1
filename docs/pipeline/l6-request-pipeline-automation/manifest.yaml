    lines: 3485
    notes: "PUSH_OWNED_RESEED_TABLES array lines 24-50 — bid_workflow_states ALREADY in push set at line 39. NO changes needed for sync engine; bid workflow mutations auto-flow to Supabase."
  daemon_adapter:
