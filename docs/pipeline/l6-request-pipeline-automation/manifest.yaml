cross_layer_context:
  prior_layers_built: ["L0", "L1", "L2", "L3", "L4", "L5"]
  l5_status: "COMPLETE — l5-completion-audit-2026-05-20.md verdict COMPLETE; 61 beads closed; 0 fix beads; ready_for_l6: true; l5_to_l6_gate_producible: true"

  # ============================================================================
  # Operator override mechanisms (spec §1.3 prerequisite check + §1.3 validation gate)
  # Step 03 TDD must specify tests + step 04 TDD optimize must verify coverage
  # ============================================================================
  operator_override_mechanisms:
    quote_role_quality_gate_override:
      gate: "Opportunities backed only by `domestic_wholesale_floor` (1688) or `optimistic_floor` (Alibaba) evidence are NOT bid-ready"
      override_path: |
        Operator can explicitly override with acknowledgment. Implementation:
          - Desktop UI presents the "floor-only evidence" warning when transitioning to ready_to_bid
          - Operator confirms acknowledgment via a structured form (records: who, when, override_reason text)
          - Acknowledgment stored on operator_decision_heads or a sibling row; IPC handler reads
            it before computing the readiness gate verdict
          - Test: bid-readiness-gate.test.ts covers both "no override → blocked" and "override present → allowed"
      audit_implications: |
        Run manifest's agent_narrative MUST cite the override (it's part of bid scope context).
        Validator overlay flags missing override-citation if the underlying bid scope includes
        floor-only evidence but the override flag is absent — would catch a UI bug that misses
        the acknowledgment.

    validation_gate_override_at_final_submission:
      gate: "Fail-closed: validator rejection or outage blocks bid_submitted transition"
      override_path: |
        Operator can explicitly override the validation gate at final submission per spec §1.3
        last paragraph: "final submission requires either validator `approved` verdict or
        explicit operator override of the validation gate."
        Implementation:
          - Desktop UI surfaces the validator verdict (or outage state) in the draft_saved review panel
          - "Override and submit" button requires structured override_reason text and is logged
          - The override is recorded in bid_workflow_states metadata + the run manifest
          - Test: validator-overlay tests cover both "rejection without override → blocked" and
            "rejection with explicit override → allowed (with log)"
      audit_implications: |
        Every override creates an audit-trail entry. The operator's override_reason text becomes
        part of the run manifest's agent_narrative for forensic review.

    no_override_for_L5_hard_blockers:
      gates_with_no_override: |
        - CLASSIFICATION_AMBIGUOUS (no override — operator must resolve classification first)
        - TARIFF_BRANCH_DIVERGENCE (no override — operator must resolve divergence)
        - SUPPLEMENTARY_UNIT_MISSING (no override — operator must provide unit)
        - decision_grade = broker_required (no override — broker engagement required)
        - classification_fresh_until expired (no override — classification re-verification required)
        - Operator decision NOT approved (no override — approval is constitutional)
        - Operator decision stale (no override — re-affirmation required)
        - Upstream pipeline trust gate: pipeline_assessments.validation_state ≠ validated AND no operator-accepted trust-debt note for the scope
      rationale: "These are constitutional gates. Bypassing them would defeat the entire L5→L6 readiness contract. The bid workflow CANNOT proceed without these being green."
  l5_to_l6_readiness_gate:
    summary: "L6 cannot reach `ready_to_bid` while ANY L5 blocker is active for the bid scope"
    blockers:
      - "CLASSIFICATION_AMBIGUOUS (any selected candidate)"
      - "TARIFF_BRANCH_DIVERGENCE (any selected candidate)"
      - "SUPPLEMENTARY_UNIT_MISSING (on required duty components)"
      - "landed_cost_estimates.decision_grade = broker_required"
      - "landed_cost_estimates.classification_fresh_until expired for expected import window"
    quote_role_gate: |
      Opportunities backed only by `domestic_wholesale_floor` (1688) or `optimistic_floor` (Alibaba)
      evidence are NOT bid-ready unless operator explicitly overrides with acknowledgment.
    upstream_trust_gate: |
      No selected lot/candidate depends on `suspect` inputs; process-level rollup
      `pipeline_assessments.validation_state` must be `validated` unless operator explicitly
      accepts flagged/unverified trust debt for the scope.
    source: layer-strategy.md §10 Interface Contracts; cross-reference-index.md rows 230/256

  next_layer_after_l6: "NONE — L6 is the final layer per strategy. No L7 exists. Archive declares L6 as M6 capstone."

milestones:
  l6: M6
  exit_criterion: "System can prepare and submit one request on Procontract end-to-end with full audit trail. DoD #1-11 green. Live demo: one operator-chosen Procontract opportunity reaches draft_saved with full screenshot trail + run manifest, and a separately operator-authorized run reaches bid_submitted with portal confirmation reference + downstream visibility on web."

