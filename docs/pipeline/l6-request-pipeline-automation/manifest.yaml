new_skills:
  - path: skills/bid-portal-procontract/
    files:
      - SKILL.md                            # ~250-350 lines — playbook with 11 steps per spec §1.7, side-effect class per step
      - result.schema.json                  # SubmissionResult / DraftSaveResult / PortalStateVerification
      - checkpoint.schema.json              # Per-step resume state (step #, side_effect_class_reached, screenshot_paths)
      - canary.inputs.jsonl                 # >= 3 canary inputs (small/medium/large form complexity)
      - golden.assertions.yaml              # Per-canary expected outputs
      - validator-rubric.yaml               # MANDATORY — even though overlay-bid-portal-procontract supersedes for live runs, the rubric IS the validator harness for canary tests (skill_canary_harness.rs e2e_can_010+). Without it, canaries fail.
    reference_pattern_files:
      # Exact existing files to study + mirror — verified 2026-05-21
      - skills/procurement-ingestion/procontract-register-interest/SKILL.md             # 446 lines — playbook + CDP discipline + failure codes + side-effect declarations
      - skills/procurement-ingestion/procontract-register-interest/result.schema.json   # schema shape for portal-mutation result
      - skills/procurement-ingestion/procontract-register-interest/checkpoint.schema.json  # per-step resume state
      - skills/procurement-ingestion/procontract-register-interest/canary.inputs.jsonl  # canary input format
      - skills/procurement-ingestion/procontract-register-interest/golden.assertions.yaml  # golden assertions format
    frontmatter:
      skill_id: bid-portal/procontract
      skill_version: 0.1.0
      interaction_profile: pty_interactive
      result_schema_version: 1.0.0
      checkpoint_schema_version: 1.0.0
      # NOTE: `portal_form_high_reliability` is a NEW model profile L6 introduces (spec §1.7
      # "premium profile for externally visible portal mutations"). All existing skills use
      # `browse_stable_low_cost` or `structured_extract_low_cost`. Adding this requires a
      # new match arm in crates/daemon/src/main.rs (where model_profile is parsed via
      # `match skill.metadata.model_profile.as_str()`) — this is Phase 1 daemon-code work
      # alongside the ErrorCode extension. If L6 chooses NOT to introduce the new profile,
      # fall back to `browse_stable_low_cost` and remove this comment.
      model_profile: portal_form_high_reliability
      agent_cli: claude
      # IMPORTANT: this is the SKILL-LEVEL maximum side-effect declaration in the existing skill vocabulary
      # (values: none | local_state | external_mutation | read_only — verified across procontract-register-interest,
      # auth-signin/procontract, hmrc-customs-classification). It is DIFFERENT from L6's per-run BidScopePayload.sideEffectCap
      # (READ_ONLY / REMOTE_DRAFT / NOTIFICATION_OR_LOCK / LEGAL_DECLARATION / FORMAL_SUBMISSION / FUNDS_COMMITTED).
      # The skill-level declaration is "this skill can produce up to external_mutation"; the per-run dynamic value tracks
      # what THIS specific run actually reached and is bounded by sideEffectCap.
      side_effect_class: external_mutation
      validation_policy: always
      requires_cdp: true
      cdp_default_port: 9222
      # source_structure_version is the convention all Procontract skills follow (verified across
      # procontract-discover, procontract-enrich-tender, procontract-register-interest). Bump when
      # Procontract's HTML/selectors change in a way that breaks the skill.
      source_structure_version: procontract-bid-portal-YYYY-MM-DD     # set to launch date at Phase 4
      promotion_stage: draft           # initial; promotion to stable via L0 6-stage flow
      worker_behavior_version: bid-portal/procontract@0.1.0+1.0
      version_change_affects_behavior: true

    job_parameters_schema:
      # What the daemon's `bid_workflow::runner::run_bid_workflow_job(...)` passes to the skill via stdin / env / contract.
      # Mirrors how procurement-ingestion/procontract-register-interest receives `contracts_to_register` etc.
      # The skill MUST validate this shape against checkpoint.schema.json on entry.
      bid_scope_payload: "Inline BidScopePayload (the full 10-field object per spec §1.4)"
      company_profile: "Inline CompanyProfile resolved from shared_company_profile at companyProfileVersion"
      bid_documents: "Array of BidDocument with file_path resolved into local artifact store"
      stage_run_id: "Unique ID for this run (links artifacts back to bid_workflow_states.stage_run_id)"
      operator_override:
        kind: "OverrideKind | null — non-null only when the workflow has an explicit operator override (quote_role_floor_only | validation_gate)"
        reason: "String text the operator provided"
        recorded_by: "operator name"
        recorded_at: "ISO-8601 timestamp"

    # === Anti-patterns (consolidated DO-NOT list — inherited from procontract-register-interest discipline) ===
    must_not:
      cdp_browser:
        - "Do NOT launch a fresh browser profile — attach to operator's persistent CDP at /Users/alinaaitova/.chrome-automation:9222"
        - "Do NOT close the operator's browser"
        - "Do NOT sign out — subsequent skills (or operator) need the session"
        - "Do NOT solve captchas"
      authentication:
        - "Do NOT type credentials directly — auth-signin/procontract uses Chrome autofill"
        - "Do NOT invoke auth-signin/procontract as a sub-skill — return AUTH_STATE_STALE on session expiry; the DAEMON orchestrates the retry (per existing procontract-register-interest pattern)"
      side_effects:
        - "Do NOT escalate side-effect class past BidScopePayload.sideEffectCap — when cap reached, save draft and stop (raise BID_SIDE_EFFECT_CAP_EXCEEDED on attempt to escalate)"
        - "Do NOT submit any form OTHER than the bid response form (no profile changes, no account settings, no withdraws of other bids)"
        - "Do NOT cache or log filled values to disk — company profile fields are PII"
      portal_state:
        - "Do NOT proceed past Step 4 (Verify opportunity matches expected tender reference + check for existing draft/submission) if verifyPortalState detects an existing submission — raise BID_DUPLICATE_DETECTED"
        - "Do NOT continue if portal state diverged from the expected opportunity (page fingerprint drift) — raise PAGE_SHAPE_DRIFT (or new BID_PORTAL_CHANGED if TDD added it)"

  - path: skills/validation/overlay-bid-portal-procontract/
    files:
      - SKILL.md                            # ~80-150 lines — overlay assertions; mirrors overlay-supplier-enrichment frontmatter shape
    purpose: |
      Validator overlay for bid-portal-procontract runs. Composes with base validator
      to check portal-specific anomalies: opportunity ref match, screenshot count >= 11,
      side_effect_class progression is monotonic and <= BidScopePayload.sideEffectCap,
      submission confirmation reference well-formed, agent narrative cites lot/candidate
      IDs verbatim, no PII leakage in narrative.

# ============================================================================
# Cross-domain spec callouts (step 01 validate-spec must transcribe these)
# ============================================================================
spec_callouts:
  proactis_procontract_naming:
    spec_says: "§1.5/§1.6/§1.7 reference 'Proactis' and 'proactis-workflow.ts', 'bid-portal-proactis/'"
    actual_repo_state: "Codebase uses 'procontract' (auth-signin/procontract/, procurement-ingestion/procontract-*). Operator confirmed 2026-05-21 these are the same portal (procontract.due-north.com)."
    resolution: "Recorded as decision_1 above. Add a callout under §1.7 / §1.6 noting the alias: 'Proactis is the marketing name; Procontract is the platform — same portal procontract.due-north.com. New files use procontract naming to match existing convention.' NO scope drift — same capability."

  existing_auth_signin_procontract_reuse:
    spec_says: "§1.7 step 2: 'Authenticate with portal credentials'"
    actual_repo_state: "skills/auth-signin/procontract/ already implements the full Chrome-saved-creds CDP login flow with sales@sorelon.com (operator's real Procontract account)."
    resolution: "Recorded as decision_2. Add a callout under §1.7 step 2: 'Authentication is delegated to skills/auth-signin/procontract/. The bid-portal-procontract skill verifies signed-in state and invokes auth-signin only when session is expired (URL contains /Login OR text matches Session expired|Please log in).' Reduces bid-portal skill complexity; no new auth skill needed."

  validator_overlay_inclusion:
    spec_says: "§1.7: 'Validation policy: always — every bid run gets semantic validation'"
    actual_repo_state: "Base validator + 5 domain overlays exist (validation/base/ + 5 overlay-*). No bid-portal overlay yet."
    resolution: "Recorded as decision_3. Add a callout under §1.7 noting the validator overlay (skills/validation/overlay-bid-portal-procontract/) is included as an L6 deliverable to give the always-on validation policy domain-specific assertions. WITHOUT the overlay, base validator only checks generic structure — insufficient for portal-specific anomalies."

  side_effect_cap_default:
    spec_says: "§1.4: 'sideEffectCap: SideEffectClass — Maximum side-effect class authorized for this workflow run'"
    actual_repo_state: "No existing default. New behavior."
    resolution: "Step 01 records: bid scope payload default sideEffectCap = REMOTE_DRAFT for `reviewRequired=true` workflows (operator review safer); FORMAL_SUBMISSION only when operator explicitly toggles reviewRequired=false AND confirms a known opportunity ref. The first live demo (DoD #8 verification in step 12) runs with sideEffectCap = REMOTE_DRAFT against an operator-chosen Procontract opportunity that will reach draft_saved but not bid_submitted."

  bid_state_check_constraint:
    spec_says: "Cross-domain note for L0: bid_workflow_states.bid_state CHECK constraint should be expanded to include draft_saved and portal_state_unknown values added by L6. The current DDL allows free-text (no CHECK), so this is a recommendation, not a blocker."
    actual_repo_state: "Confirmed — migrations/0001_sqlite_state_initial.sql lines 437-451 has no CHECK on bid_state. The 7 lifecycle values are validated only in Rust."
    resolution: "Step 01 records: L6 does NOT add a SQL CHECK constraint (avoids migration churn for a non-functional change). Rust enforces the enum at the bid-workflow state machine layer. Cross-domain note remains as forward-compatibility guidance for any future schema cleanup pass."

  operator_decision_heads_staleness_l5_vectors:
    spec_says: "Cross-domain note for L4: operator_decision_heads staleness detection must include L5 freshness vectors (tariff structure, measures, remedies, FX) in addition to pipeline assessment hash. When any L5 freshness vector expires for classifications backing an approved decision, the decision should be marked stale."
    actual_repo_state: "Confirmed in research: classification_fresh_until_expired() at crates/daemon/src/main.rs:5537-5542; the L6 readiness gate must consume this signal at decisionBasisHash computation time."
    resolution: "Step 01 records: decisionBasisHash for BidScopePayload covers (a) pipeline_assessments hash, (b) selected supplier_quotes versions, (c) shared_company_profile version, (d) per-candidate landed_cost_estimates.classification_fresh_until + classification_fresh_until_expired result + tariff/measures/remedies/FX vector hashes from L5. ANY change → reviewedBasisHash != current → bid blocked."

  bid_workflow_runner_module_placement:
    spec_says: "(silent — no spec'd module layout for runner)"
    actual_repo_state: "Open architectural decision: dedicated crates/daemon/src/bid_workflow/ module vs inline in main.rs"
    resolution: |
      RECOMMENDED RESOLUTION (TDD step 03 to confirm or override):

      Phase 1 (Foundation) creates the module SKELETON:
        - crates/daemon/src/bid_workflow/mod.rs           (module root with public exports)
        - crates/daemon/src/bid_workflow/types.rs         (mirror packages/bidding/bid-scope-types.ts in Rust — BidScopePayload, SideEffectClass enum, etc.)
        - crates/daemon/src/bid_workflow/runner.rs        (stub `pub async fn run_bid_workflow_job(...) -> Result<JobOutcome>` with a Phase 3 sentinel body)
        - crates/daemon/src/bid_workflow/readiness_gate.rs (stub readiness-gate evaluator)
        - crates/daemon/src/bid_workflow/state_machine.rs  (stub state transitions)
      Phase 1 also wires `mod bid_workflow;` into main.rs so subsequent phases can `use crate::bid_workflow::...`.

      Phase 2 (Daemon Runtime) wires the dispatch arm in main.rs (around line 1513+):
        - Adds `"run_bid_workflow" => bid_workflow::runner::run_bid_workflow_job(runtime, &runner, claimed).await`
        - Adds the `trigger_bid_workflow` IPC handler in `crates/daemon/src/ipc/handlers/jobs.rs` (following trigger_ingestion at line 45 + trigger_enrichment at line 95)
        - Adds the `--run-bid-workflow` CLI subcommand to main.rs (mirroring existing CLI subcommands)
        - At this stage the dispatch wires to the Phase 1 sentinel stub; Phase 3 fills out the body before execution.

      Phase 3 (State Machine + Readiness Gate) implements the actual logic:
        - bid_workflow/runner.rs body — load skill, inject CompanyProfile, spawn PTY, capture screenshots, persist transitions
        - bid_workflow/state_machine.rs body — all 14 transitions with prerequisite checks
        - bid_workflow/readiness_gate.rs body — wrap existing L5 checks + quote-role + freshness + company-profile + upstream-trust
        - decisionBasisHash computation
        - 8 invariant enforcement points

      Rationale:
        - main.rs already at 31K lines — keeping a discrete module is safer for readability + compile time
        - Phase 2 dispatch needs a function to call — stub-first lets Phase 2 + Phase 3 parallelize
        - Module skeleton in Phase 1 gives Phase 2 a stable import path
        - Phase 3 fills out without changing dispatch wiring

      IF TDD step 03 decides differently (e.g., inline everything in main.rs), the strategy + beads must reflect that — but currently the bias is toward a dedicated module.

  webpolicy_for_bid_visibility:
    spec_says: "(silent on web portal surface)"
    actual_repo_state: "L4 web is read-only viewer with RLS viewer-role enforcement. L6 spec §1.9 says bid_workflow_states 'synced to Supabase for web visibility' but doesn't detail UI surface."
    resolution: "Step 01 records: web viewer gets a read-only bid_state badge on process detail page (mirrors PipelineBadge); draft_saved triggers a 'Operator review required' note (no UI to perform the review — that's desktop-only). RLS allows viewer role to see bid_state but NOT the BidScopePayload JSON or the run manifest contents (these contain potentially sensitive company-profile fields). Step 03 TDD verifies the RLS boundary."

  no_ci_workflows:
    spec_says: "(silent)"
    actual_repo_state: "No .github/workflows/ directory. Tests run locally only (same as L5)."
    resolution: "L6 bootstrap doc lists the local quality gate sequence verbatim from L5's bootstrap. The locked L6 route uses local gates rather than adding a CI workflow."

