existing_files:
  # L0 schema — bid_workflow_states + error_manifests already exist
  migration_l0:
    path: migrations/0001_sqlite_state_initial.sql
    lines: 545
    notes: |
      bid_workflow_states table at lines 437-451: process_id (PK, FK), bid_state (TEXT, default 'not_started'),
      bid_scope_json (TEXT, nullable), review_required (INTEGER, default 0), bid_job_id, started_at,
      completed_at, owner_id, row_version, last_local_seq, stage_run_id, updated_at, created_at.
      No CHECK constraint on bid_state — spec §1.3 recommends future expansion to enforce the 7 lifecycle
      states. L6 does NOT add a CHECK (avoids schema churn); validation done in Rust.

      supplier_quotes table at lines 243-296 includes price_signal_role (line 272) for L5→L6 quote-role
      gate (optimistic_floor / domestic_wholesale_floor → bid blocked unless operator overrides).

      landed_cost_estimates table at lines 322-394 carries L5 fields: blockers JSON (line 381),
      decision_grade TEXT (line 377), classification_fresh_until TEXT (line 384).
  migration_l3:
    path: migrations/0003_sqlite_runtime.sql
    notes: "error_manifests table at lines 49-65: id, job_id, process_id, pipeline_stage, workflow_step, error_type, error_message, error_context, skill_path, agent_session_id, markdown_path, resolved, resolved_at, resolved_by, created_at."
