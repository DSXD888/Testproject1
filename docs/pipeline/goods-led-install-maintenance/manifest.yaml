# ============================================================================
# What this feature is
# ============================================================================
# Two coupled capabilities (the research doc is the contract — ZERO scope drift):
#   1. WIDEN the qualification filter so goods-LED supply-and-install /
#      supply-and-maintain contracts surface (two-phase qualification + a
#      relaxed description-quality service gate), while STILL rejecting
#      service-only contracts (decided by a configurable goods value-share rule).
#   2. BUILD a modular UK installation/maintenance labour-cost engine as a
#      first-class peer to freight/customs/VAT in the landed-cost rollup
#      (a new transient-loaded landed-cost skill + skill-local reference tables).
# Both halves SHIP TOGETHER — the filter cannot be trusted until the labour
# engine exists (ADR-001). Estimates are SCREENING-GRADE (±20%) only.

