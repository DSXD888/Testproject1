key_types:
  # From L1 (integration surface)
  - name: "AgentAdapter"
    kind: "trait"
    location: "crates/daemon/src/agents/adapter.rs"
    relevance: "DaemonBridge invokes adapter-mediated sessions"
  - name: "ControlEvent"
    variants: "Started | Checkpoint | Progress | AuthChallenge | Warning | FinalResultReady | Exited"
    location: "crates/daemon/src/agents/adapter.rs"
    relevance: "Channel<T> relays these as BridgeEvent payloads"
  - name: "SessionPhase"
    variants: "Created | Spawned | Active | Terminating | Exited | Reaped | Archived"
    location: "crates/daemon/src/pty/session.rs"
    relevance: "SessionRegistry tracks phase transitions"
  - name: "CleanupVerdict"
    variants: "Clean | Forced | Leaked"
    location: "crates/daemon/src/sessions/reaper.rs"
    relevance: "Lifecycle events carry cleanup verdict"

  # New L2 types (TypeScript)
  - name: "QueryEnvelope<T>"
    fields: "data, snapshotSeq, snapshotAt"
    location: "apps/desktop/src-tauri/src/query_service.rs (Rust) + apps/desktop types"
    relevance: "Every snapshot query returns this — commit fence model"
  - name: "ControlPlaneState"
    fields: "daemonInstanceId, daemonVersion, protocolVersion, schemaEpoch, storage, daemon, control, load, reasons"
    location: "apps/desktop/src/hooks/use-control-plane.ts"
    relevance: "Bootstrap state machine derives UX mode from this"
  - name: "MutationAck"
    fields: "accepted, idempotencyKey, durability, visibleAfterSeq, jobId, sessionId, remoteState"
    location: "apps/desktop/src-tauri/src/daemon_bridge.rs"
    relevance: "Every mutation returns ack with commit fence data"
  - name: "SessionFrame"
    variants: "lifecycle | pty | stdout | stderr | event | gap"
    location: "apps/desktop types"
    relevance: "Channel<T> stream type — the live streaming wire format"
  - name: "BridgeRequest"
    variants: "hello | command | subscribe | unsubscribe"
    location: "apps/desktop/src-tauri/src/daemon_bridge.rs"
    relevance: "IPC wire format from desktop to daemon"
  - name: "ContractCardFrameProps"
    fields: "summary, metrics, decision, rightRail, actions"
    location: "packages/ui/contract-card-frame.tsx"
    relevance: "Core shared component props — frame+slot pattern"
  - name: "ManifestInput"
    fields: "process, notices, lots, candidates, quotes, pricingAssessments, landedCosts, pipelineAssessment, coverageMetrics"
    location: "packages/manifests/render-opportunity.ts"
    relevance: "Manifest renderer input — full pipeline data"
  - name: "CoverageInput/CoverageOutput"
    fields: "lots[], pricedCoverageBps, netQualifiedCoverageBps, unresolvedMandatoryLots"
    location: "packages/intelligence/src/margins/coverage-rollup.ts"
    relevance: "Coverage rollup computation"

