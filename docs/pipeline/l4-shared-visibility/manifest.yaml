# === Cross-domain notes the validate-spec step must surface ===
spec_callouts:
  migration_filename_mismatch:
    spec_says: "sqlite/migrations/0002_sqlite_state_sync.sql"
    actual_repo_convention: "flat migrations/NNNN_*.sql with next-free sequence 0012"
    resolution: "Replace with 'migrations/0012_l4_sync_state.sql' (or next available NNNN_) — improves HOW, does NOT reduce scope"
  local_outbox_reservation:
    spec_says: "(from L0 §2 DDL)"
    actual: "local_outbox is NOT in migrations/0001_sqlite_state_initial.sql — L4 owns this DDL"
    resolution: "Spec must clarify: L4 creates local_outbox in its SQLite migration; L0 does not pre-reserve it"
  no_http_client_in_daemon:
    issue: "crates/daemon/Cargo.toml has neither reqwest nor tokio-postgres"
    resolution: "L4 implementation handoff must add the dependency; bootstrap doc must list this as environment prerequisite"
  greenfield_apps_web:
    issue: "apps/web/ does not exist; not in root package.json workspaces"
    resolution: "L4 bootstrap must wire apps/web into the workspace and root scripts (build, test, lint)"
  greenfield_infra_supabase:
    issue: "infra/supabase/ does not exist"
    resolution: "L4 creates infra/supabase/{config.toml, migrations/*.sql} from scratch"
  ui_lint_invariant:
    rule: "packages/ui must NOT import @tauri-apps/api, apps/desktop, crates/daemon, supabase, transport"
    apply: "apps/web reuses packages/ui presentational components; apps/web data-fetching lives in apps/web/src/lib/{supabase.ts,broadcast.ts} (web-only)"
  agents_md_duplication:
    issue: "AGENTS.md has both an authoritative 'br' block (~L247-298) and a duplicated/outdated 'bd sync' block (~L651-708)"
    resolution: "Fresh agents must use 'br' + 'bin/br-sync' (or 'br sync --flush-only' followed by manual git add .beads/ + commit)"

