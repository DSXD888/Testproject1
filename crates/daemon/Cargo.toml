[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.38", features = ["derive"] }
fs4 = "0.8.4"
nix = { version = "0.29.0", features = ["signal", "process", "term", "socket", "user"] }
portable-pty = "0.8.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.0.17"
tempfile = "3.20.0"

[lints]
workspace = true
