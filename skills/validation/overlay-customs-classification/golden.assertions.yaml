compatibility_assertions:
  validator_behavior_version: validation/overlay-customs-classification@1.0.0+1.0
  compatible_worker_behavior_versions:
    - customs-classification/*@1.0.0+1.0
    - skills/supplier-price-enrichment/alibaba@2.0.0
    - skills/supplier-price-enrichment/1688@2.0.0
    - skills/supplier-price-enrichment/amazon@2.0.0
  incompatible_worker_behavior_versions:
    - customs-classification/*@0.x
  incompatible_versions_block_promotion: true

promotion_gate_assertions:
  test_ids:
    - L5-T-freight_engine-013
    - L5-T-freight_engine-018
  candidate_stage_not_authoritative_without_canary_shadow: true
  stable_promotion_requires_compatible_worker_validator_versions: true
  required_standard_files:
    - SKILL.md
    - result.schema.json
    - checkpoint.schema.json
    - canary.inputs.jsonl
    - golden.assertions.yaml
    - validator-rubric.yaml

calibration_targets:
  mutated_bad_catch_rate_min_bps: 9000
  clean_real_approval_min_bps: 9500
  false_positive_rate_max_bps: 500
  wilson_confidence_bps: 9500

domain_check_inventory:
  - candidate_recall_agreement
  - declarable_commodity_code_10
  - exporter_rate_basis
  - duty_breakdown_json
  - customs_cost_spread_bps
  - decision_grade
  - redaction_boundary
  - behavior_version_compatibility
